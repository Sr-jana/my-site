{% assign fmt = include.fmt | default: "%m-%d" %}
<div class="post">
  <span class="date">{{ include.post.date | date: fmt }}</span>
  <div>
    <a href="{{ include.post.url | relative_url }}">{{ include.post.title }}</a>
    {% if include.post.tags.size > 0 %}
    <div class="tags small">{% for t in include.post.tags %}<span class="tag">{{ t }}</span>{% endfor %}</div>
    {% endif %}
  </div>
</div>
